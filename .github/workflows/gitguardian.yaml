name: GitGuardian scan

on: [push, pull_request]

jobs:
  scanning:
    name: GitGuardian scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # fetch all history so multiple commits can be scanned

      - name: Check for GitGuardian API Key
        id: check_key
        run: |
          if [ -z "${{ secrets.GITGUARDIAN_API_KEY }}" ]; then
            echo "has_key=false" >> $GITHUB_OUTPUT
            echo "::warning title=GitGuardian Scan Omitido::El secreto GITGUARDIAN_API_KEY no está configurado en GitHub Secrets. Se omite el escaneo para no romper el build."
          else
            echo "has_key=true" >> $GITHUB_OUTPUT
          fi

      - name: GitGuardian scan
        if: steps.check_key.outputs.has_key == 'true'
        uses: GitGuardian/ggshield/actions/secret@v1.56.0
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
